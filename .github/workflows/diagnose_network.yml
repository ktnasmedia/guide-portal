name: 네트워크조건 진단
on: {workflow_dispatch: {}}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python3 diagnose_network.py
