name: 포스터 데이터 진단 (수동)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python diag_poster.py
      - uses: actions/upload-artifact@v4
        with:
          name: diag-poster
          path: diag_poster_result.txt
