name: 티빙 수집범위 진단 (수동)

# 수동으로만 실행 (Actions 탭 → Run workflow)
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install requests

      - name: 진단 실행 (결과는 로그에서 확인)
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python diagnose_tving.py
