name: 모달 데이터 진단 (수동)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python diag_modal.py
      - name: 결과 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: diag-result
          path: diag_result.txt
