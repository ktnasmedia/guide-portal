name: 콘텐츠 라인업 자동 수집

# 실행 시점: 매일 새벽 3시(KST 기준) + 수동 실행 버튼
on:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = KST 03:00
  workflow_dispatch:        # 깃허브에서 수동 실행도 가능

permissions:
  contents: write           # 결과 파일을 커밋하기 위해 필요

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 라이브러리 설치 (티빙 광고페이지 파싱용)
        run: pip install requests beautifulsoup4

      - name: 수집 스크립트 실행
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python3 collect_lineup.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content_lineup.json collection_log.md tving_wavve_list.csv tving_ads_accumulated.json
          if git diff --staged --quiet; then
            echo "변경사항 없음 - 커밋 생략"
          else
            git commit -m "자동 수집: 콘텐츠 라인업 갱신 ($(date +'%Y-%m-%d'))"
            git push
          fi
