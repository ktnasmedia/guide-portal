name: 티빙 공지사항 자동 수집

# 실행 시점: 매일 새벽 3시 30분(KST) + 수동 실행 버튼
on:
  schedule:
    - cron: '30 18 * * *'   # UTC 18:30 = KST 03:30
  workflow_dispatch:        # 깃허브에서 수동 실행도 가능

permissions:
  contents: write           # 결과 파일을 커밋하기 위해 필요

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 수집 스크립트 실행 (표준 라이브러리만 사용)
        run: python3 collect_tving_notices.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tving_notices.json
          if git diff --staged --quiet; then
            echo "변경사항 없음 - 커밋 생략"
          else
            git commit -m "자동 수집: 티빙 공지사항 갱신 ($(date +'%Y-%m-%d'))"
            git push
          fi
