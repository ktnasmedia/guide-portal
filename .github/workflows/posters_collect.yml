name: 포스터 이미지 보존

on:
  # 콘텐츠 라인업 수집이 끝나면 이어서 자동 실행
  workflow_run:
    workflows: ["콘텐츠 라인업 자동 수집"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    # 수집이 성공했을 때만 (수동 실행은 항상)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 포스터 이미지 저장
        run: python3 collect_posters.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posters content_lineup.json
          if git diff --staged --quiet; then
            echo "변경사항 없음 - 커밋 생략"
          else
            git commit -m "포스터 이미지 보존 ($(date +'%Y-%m-%d'))"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "푸시 재시도 $i..."
              sleep 5
            done
          fi
