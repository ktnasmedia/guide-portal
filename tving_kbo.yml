name: 티빙 KBO 청약 정보 자동 수집

# 실행 시점: 매일 오전 9시 · 오후 2시(KST) + 수동 실행 버튼
# 잔여 구좌는 팔릴 때마다 바뀌므로 하루 두 번 갱신
on:
  schedule:
    - cron: '0 0,5 * * *'   # UTC 00:00 = KST 09:00 / UTC 05:00 = KST 14:00
  workflow_dispatch:        # 깃허브에서 수동 실행도 가능

permissions:
  contents: write           # 결과 파일을 커밋하기 위해 필요

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 수집 스크립트 실행 (표준 라이브러리만 사용)
        run: python3 collect_tving_kbo.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tving_kbo.json
          if git diff --staged --quiet; then
            echo "변경사항 없음 - 커밋 생략"
          else
            git commit -m "자동 수집: KBO 청약 정보 갱신 ($(date +'%Y-%m-%d %H:%M'))"
            git push
          fi
